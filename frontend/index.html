<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenRSS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="sidebar-header">
          <button id="btn-search" class="icon-btn" title="Search (/)"></button>
          <div class="sidebar-header-actions">
            <button
              id="btn-refresh-all"
              class="icon-btn"
              title="Refresh all"
            ></button>
            <button
              id="btn-settings"
              class="icon-btn"
              title="Settings"
            ></button>
          </div>
        </div>
        <div id="all-articles-row" class="feed-item active">
          <span class="feed-name">All articles</span>
          <span id="all-unread-badge" class="badge hidden"></span>
        </div>
        <div id="feed-list" class="scroll-hidden feed-list"></div>
        <div class="add-feed">
          <input
            id="add-feed-input"
            placeholder="Add feed URL…"
            autocomplete="off"
          />
          <button
            id="add-feed-btn"
            title="Add feed"
            aria-label="Add feed"
          ></button>
        </div>
      </aside>

      <div id="main">
        <div id="article-pane">
          <div class="toolbar">
            <span id="feed-title-label">All articles</span>
            <span id="feed-item-count" class="dim-label"></span>
            <button id="mark-all-read-btn">Mark all read</button>
          </div>
          <div id="article-list" class="scroll-hidden"></div>
        </div>

        <div id="reader" class="reader">
          <div class="reader-header">
            <button
              id="reader-close"
              class="icon-btn"
              title="Close (Esc)"
            ></button>
            <span id="reader-feed-title"></span>
          </div>
          <div id="reader-content" class="scroll-hidden"></div>
        </div>
      </div>
    </div>

    <div id="search-overlay" class="overlay hidden">
      <div class="modal search-modal">
        <div class="search-bar">
          <span id="search-icon" class="icon"></span>
          <input
            id="search-input"
            placeholder='Search keywords or "exact phrases"'
            autocomplete="off"
          />
          <span id="search-count" class="dim-label"></span>
          <kbd>Esc</kbd>
        </div>
        <div class="search-filters">
          <label>From <input type="date" id="search-from" /></label>
          <label>To <input type="date" id="search-to" /></label>
        </div>
        <div id="search-keywords" class="keyword-chips hidden"></div>
        <div class="search-body">
          <div id="search-results" class="scroll-hidden search-results"></div>
          <div
            id="search-preview"
            class="scroll-hidden search-preview hidden"
          ></div>
        </div>
      </div>
    </div>

    <div id="settings-overlay" class="overlay hidden">
      <div class="modal settings-modal">
        <div class="modal-header">
          <span>Settings</span>
          <button id="settings-close" class="icon-btn"></button>
        </div>
        <div class="stats-row">
          <div class="stat">
            <div id="stat-feeds" class="stat-value">0</div>
            <div class="stat-label">Feeds</div>
          </div>
          <div class="stat">
            <div id="stat-articles" class="stat-value">0</div>
            <div class="stat-label">Articles cached</div>
          </div>
        </div>
        <div class="settings-section">
          <div class="section-label">OPML</div>
          <div class="action-row">
            <button id="btn-import" class="action-btn">Import OPML</button>
            <button id="btn-export" class="action-btn">Export OPML</button>
          </div>
          <input
            id="opml-file-input"
            type="file"
            accept=".opml,.xml"
            class="hidden"
          />
          <p id="opml-hint" class="hint">Import/export OPML 2.0</p>
        </div>
        <div class="settings-section">
          <div class="feeds-grid">
            <div class="section-label">Feeds</div>
            <label for="article-cap-input" class="section-label">Max articles per feed</label>
            <div></div>
            <button id="btn-refresh-all-2" class="action-btn">
              Refresh all feeds
            </button>
            <input
              id="article-cap-input"
              type="number"
              min="0"
              placeholder="Unlimited"
            />
            <button id="btn-save-cap" class="action-btn">Save</button>
          </div>
        </div>
        <div class="settings-section">
          <div class="section-label">Storage</div>
          <button id="btn-clear-cache" class="action-btn danger">
            Clear article cache
          </button>
          <p class="hint">Clears cached articles. Feeds are preserved.</p>
        </div>
      </div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
