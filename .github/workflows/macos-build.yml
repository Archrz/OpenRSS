name: macOS build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: arm64
        run: go build -o openrss .

      - name: Assemble .app bundle
        run: |
          bundle="OpenRSS.app/Contents"
          mkdir -p "$bundle/MacOS" "$bundle/Resources"
          cp openrss "$bundle/MacOS/openrss"
          cp packaging/macos/Info.plist "$bundle/Info.plist"
          cp packaging/macos/AppIcon.icns "$bundle/Resources/AppIcon.icns"
          codesign --force --deep -s - OpenRSS.app
          mkdir dist
          mv OpenRSS.app dist/

      - uses: actions/upload-artifact@v4
        with:
          name: OpenRSS-MacOS-arm64
          path: dist
